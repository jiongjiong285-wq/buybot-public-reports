<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L1 光环店评价日报</title>
<style>
:root{--ink:#17324d;--muted:#6b7f91;--blue:#2367d1;--soft:#eef5ff;--good:#e9f8ef;--warn:#fff3e3;}
*{box-sizing:border-box} body{margin:0;background:#f5f8fb;color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 18px 60px} h1{font-size:30px;margin:0 0 8px} h2{margin-top:30px}
.sub{color:var(--muted)} .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.metric{background:white;border-radius:14px;padding:15px;box-shadow:0 4px 18px #17324d10} .metric span,.metric small{display:block;color:var(--muted)} .metric strong{display:block;font-size:28px;color:var(--blue)}
.notice{border-radius:12px;background:var(--good);padding:12px 15px;margin:12px 0} .advice{background:var(--soft);border-radius:14px;padding:15px 22px}
table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden} th,td{padding:11px;border-bottom:1px solid #e6edf4;text-align:left;vertical-align:top} th{background:#edf4fb}
tr.bad td{background:var(--warn)} .empty{background:white;padding:18px;border-radius:14px;color:var(--muted)} footer{margin-top:30px;color:var(--muted);font-size:13px}
</style></head><body><main>
<h1>L1 光环店评价日报</h1>
<p class="sub">统计范围：2026-08-10 至 2026-08-10｜数据来源：current_snapshot</p>
<div class="metrics"><div class='metric'><span>周期新增</span><strong>0</strong><small></small></div><div class='metric'><span>平均评分</span><strong>0</strong><small></small></div><div class='metric'><span>需改进项</span><strong>0</strong><small></small></div><div class='metric'><span>本次回复</span><strong>1</strong><small></small></div><div class='metric'><span>有效未回复</span><strong>0</strong><small></small></div></div>
<div class='notice'>昨天没有新增评价</div><div class='notice'>非常棒！昨天没有差评，继续努力。</div>
<div class="advice"><strong>评价分析与店长建议</strong><ul><li>昨日新增 0 条；门店每日目标为 3 条，请加强真实评价管理。</li><li>表现好的方面：昨日没有新增评价，门店仍需保持主动服务和餐后真实邀评。</li><li>改进观察：暂无明确差评改进项；继续巡查环境、出品节奏和服务细节。</li></ul></div>

<footer>仅展示评价业务数据；不包含机器人密钥、群 ID、浏览器凭据或本地路径。</footer>
</main></body></html>
